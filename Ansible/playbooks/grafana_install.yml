---
- name: 07 - Desplegar Grafana en monitor-server
  hosts: monitor  # Solo se ejecuta en el servidor monitor
  become: true

  tasks:
    # --- 1. Añadir Repositorio de Grafana ---
    - name: 1.1 Instalar dependencias para añadir repositorios
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - software-properties-common
          - wget
        state: present
        update_cache: yes

    - name: 1.2 Añadir clave GPG del repositorio de Grafana
      ansible.builtin.apt_key:
        url: https://apt.grafana.com/gpg.key
        state: present

    - name: 1.3 Añadir repositorio APT de Grafana
      ansible.builtin.apt_repository:
        repo: "deb https://apt.grafana.com stable main"
        state: present
        filename: grafana
        update_cache: yes

    # --- 2. Instalar Grafana ---
    - name: 2.1 Instalar Grafana
      ansible.builtin.apt:
        name: grafana
        state: present

    # --- 3. Instalar Plugins ---
    - name: 3.1 Instalar el plugin de Zabbix para Grafana
      ansible.builtin.grafana_plugin:
        name: alexanderzobnin-zabbix-app
        state: present
      notify: Reiniciar grafana-server

    # --- 4. Iniciar Servicio ---
    - name: 4.1 Asegurar que Grafana esté iniciado y habilitado
      ansible.builtin.systemd:
        name: grafana-server
        enabled: yes
        state: started

  # --- Handlers ---
  handlers:
    - name: Reiniciar grafana-server
      ansible.builtin.systemd:
        name: grafana-server
        state: restarted
